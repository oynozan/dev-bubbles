<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="dark" />
        <title>Dev Bubbles</title>
        <style>
            html, body, #root { height: 100%; margin: 0; }
            body { font-family: system-ui, sans-serif; font-size: 13px; color: #e5e5e5; background: #1a1a1a; }
            button { font: inherit; }

            .app { display: flex; flex-direction: column; height: 100%; }
            .map-area { position: relative; flex: 1; min-height: 0; overflow: hidden; }
            .bubble-map, .bubble-map > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
            .bubble-map > svg { display: block; background: #1a1a1a; }

            .bubble { cursor: pointer; }
            .bubble > circle { stroke: #ffffff; stroke-opacity: 0.12; vector-effect: non-scaling-stroke; }
            .label { fill: #e5e5e5; stroke: #1a1a1a; stroke-width: 0.25em; stroke-linejoin: round; paint-order: stroke; font-weight: 500; pointer-events: none; }
            /* The map sets --zoom when a zoom ends, so an open group's name never shrinks below 11px on screen */
            .label.curved { font-size: max(var(--fitted-size), calc(11px / var(--zoom, 1))); }
            .zooming .label { display: none; }

            /* Stroke and fill opacity, since opacity on each of thousands of paths composites them one by one */
            .edge { fill: none; stroke: #d4d4d4; stroke-opacity: 0.4; marker-end: url(#edge-arrow); vector-effect: non-scaling-stroke; pointer-events: none; }
            .edge.http { stroke-dasharray: 5 4; }
            /* Only the hovered bubble's HTTP edges take the pointer, for their route tooltip */
            .edge-focus .edge.http.related { pointer-events: stroke; }
            .edge-arrow { fill: #d4d4d4; fill-opacity: 0.4; }
            .edge-focus .edge { stroke-opacity: 0.08; marker-end: url(#edge-arrow-dimmed); }
            .edge-focus .edge.related { stroke-opacity: 0.95; marker-end: url(#edge-arrow-related); }
            .edges.dense .edge { marker-end: none; }
            .edge-focus .edges.dense .edge.related { marker-end: url(#edge-arrow-related); }
            #edge-arrow-dimmed .edge-arrow { fill-opacity: 0.08; }
            #edge-arrow-related .edge-arrow { fill-opacity: 0.95; }

            /* Status, the only color on the map */
            circle.mark { stroke: #ef4444; stroke-opacity: 1; vector-effect: non-scaling-stroke; }
            circle.mark.suspected { stroke-width: 1.5; }
            circle.mark.confirmed { fill: #b91c1c; stroke-width: 3; }
            .mark-stripes rect { fill: #ef4444; }
            circle.mark-ring { fill: none; stroke: #ef4444; stroke-opacity: 0.7; stroke-width: 2; vector-effect: non-scaling-stroke; pointer-events: none; }
            circle.mark-ring.confirmed { stroke-opacity: 1; stroke-width: 4; }
            .mark-badge { font-size: 11px; font-weight: 600; pointer-events: none; }
            .mark-badge rect { fill: #1a1a1a; stroke: #ef4444; stroke-width: 1.5; }
            .mark-badge text { fill: #fca5a5; }
            .mark-badge.confirmed rect { fill: #dc2626; stroke: #fca5a5; }
            .mark-badge.confirmed text { fill: #ffffff; }
            .mark.dimmed, .mark-ring.dimmed, .mark-badge.dimmed { opacity: 0.3; }

            .legend, .bug-panel, .map-hint, .status-line { background: rgba(26, 26, 26, 0.88); border: 1px solid #333333; border-radius: 6px; }

            .breadcrumb { position: absolute; top: 8px; left: 8px; right: 8px; pointer-events: none; }
            .breadcrumb ol { display: flex; flex-wrap: wrap; align-items: center; margin: 0; padding: 0; list-style: none; }
            .breadcrumb li + li::before { content: '/'; margin: 0 2px; color: #737373; }
            .breadcrumb button { padding: 2px 6px; border: 1px solid #333333; border-radius: 4px; background: rgba(26, 26, 26, 0.88); color: #a3a3a3; cursor: pointer; pointer-events: auto; }
            .breadcrumb button:hover { color: #f5f5f5; text-decoration: underline; }
            .breadcrumb button[aria-current] { color: #f5f5f5; font-weight: 600; }
            .bubble-map:has(.bug-panel) .breadcrumb { right: 284px; }

            .map-side { position: absolute; top: 8px; right: 12px; bottom: 12px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; pointer-events: none; }
            .map-side > * { pointer-events: auto; }

            .bug-panel { width: 260px; max-width: calc(100vw - 48px); min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #525252 transparent; padding: 6px 0; color: #d4d4d4; font-size: 12px; }
            .bug-panel h2 { margin: 0; padding: 0 10px 4px; color: #a3a3a3; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
            .bug-panel ul { margin: 0; padding: 0; list-style: none; }
            .bug-panel button { display: block; width: 100%; padding: 6px 10px; border: 0; background: none; color: inherit; text-align: left; cursor: pointer; }
            .bug-panel button:hover { background: #262626; }
            .bug-panel .bug[aria-pressed='true'] { background: #2e2e2e; box-shadow: inset 2px 0 #d4d4d4; }
            .bug-title { display: block; color: #f5f5f5; font-weight: 500; overflow-wrap: anywhere; }
            .bug-meta { display: block; margin-top: 2px; color: #a3a3a3; }
            .bug-meta code { font-family: ui-monospace, monospace; }
            .bug-panel .bug-marks { padding-bottom: 4px; }
            .bug-marks button { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; column-gap: 6px; align-items: center; padding: 4px 10px 4px 18px; }
            .mark-symbol { width: 12px; height: 12px; overflow: visible; }
            .mark-name { color: #e5e5e5; overflow-wrap: anywhere; }
            .mark-state { color: #fca5a5; }
            .mark-reason { grid-column: 2 / -1; margin-top: 2px; color: #a3a3a3; }
            .bug-marks-empty { margin: 0; padding: 4px 18px 8px; color: #a3a3a3; }

            .legend { flex: none; margin: auto 0 0; padding: 6px 10px; list-style: none; color: #d4d4d4; }
            .legend li { display: flex; align-items: center; gap: 8px; line-height: 20px; }
            .legend-symbol { width: 24px; height: 12px; overflow: visible; }
            .legend-symbol .edge { stroke-opacity: 0.9; stroke-width: 1.5; marker-end: none; }

            .map-hint { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); max-width: calc(100% - 320px); margin: 0; padding: 6px 12px; color: #d4d4d4; text-align: center; }
            .status-line { position: absolute; left: 12px; bottom: 12px; margin: 0; padding: 4px 8px; color: #fcd34d; }

            .error-banner { max-height: 30vh; overflow-y: auto; padding: 8px 16px; background: #2a1215; border-bottom: 1px solid #5c1f24; color: #fca5a5; }
            .error-banner ul { margin: 0; padding-left: 18px; }
            .error-banner li { font-family: ui-monospace, monospace; line-height: 1.5; overflow-wrap: anywhere; }
            .error-banner button { margin-top: 4px; padding: 0; border: 0; background: none; color: inherit; text-decoration: underline; cursor: pointer; }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/main.tsx"></script>
    </body>
</html>
