<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Dev Bubbles</title>
        <style>
            html, body, #root { height: 100%; margin: 0; }
            body { font-family: system-ui, sans-serif; font-size: 13px; color: #1f2937; background: white; }
            button { font: inherit; }

            .app { display: flex; flex-direction: column; height: 100%; }
            .map-area { position: relative; flex: 1; min-height: 0; overflow: hidden; }
            .bubble-map, .bubble-map > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
            .bubble-map > svg { display: block; }

            .bubble { cursor: pointer; }
            .bubble > circle.group { stroke: #290819; stroke-opacity: 0.2; vector-effect: non-scaling-stroke; }
            .label { fill: #374151; stroke: white; stroke-linejoin: round; paint-order: stroke; font-weight: 500; pointer-events: none; }
            .zooming .label { display: none; }
            .edges { pointer-events: none; }

            .breadcrumb { position: absolute; top: 8px; left: 8px; right: 8px; pointer-events: none; }
            .breadcrumb ol { display: flex; flex-wrap: wrap; margin: 0; padding: 0; list-style: none; }
            .breadcrumb li + li::before { content: '/'; margin: 0 2px; color: #9ca3af; }
            .breadcrumb button { padding: 2px 6px; border: 0; border-radius: 4px; background: rgba(255, 255, 255, 0.85); color: #2563eb; cursor: pointer; pointer-events: auto; }
            .breadcrumb button:hover { text-decoration: underline; }
            .breadcrumb button[aria-current] { color: #1f2937; font-weight: 600; }

            .legend { position: absolute; right: 12px; bottom: 12px; max-height: 40%; overflow-y: auto; margin: 0; padding: 6px 10px; list-style: none; background: rgba(255, 255, 255, 0.85); border-radius: 6px; }
            .legend li { display: flex; align-items: center; gap: 6px; line-height: 18px; }
            .swatch { width: 10px; height: 10px; border-radius: 50%; }

            .status-line { position: absolute; left: 12px; bottom: 12px; margin: 0; padding: 4px 8px; border-radius: 4px; background: #fef3c7; color: #92400e; }

            .error-banner { max-height: 30vh; overflow-y: auto; padding: 8px 16px; background: #fef2f2; border-bottom: 1px solid #fecaca; color: #991b1b; }
            .error-banner ul { margin: 0; padding-left: 18px; }
            .error-banner li { font-family: ui-monospace, monospace; line-height: 1.5; overflow-wrap: anywhere; }
            .error-banner button { margin-top: 4px; padding: 0; border: 0; background: none; color: inherit; text-decoration: underline; cursor: pointer; }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/main.tsx"></script>
    </body>
</html>
