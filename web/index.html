<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="dark" />
        <title>Dev Bubbles</title>
        <style>
            html, body, #root { height: 100%; margin: 0; }
            body { font-family: system-ui, sans-serif; font-size: 13px; color: #e5e5e5; background: #1a1a1a; }
            button { font: inherit; }

            .app { display: flex; flex-direction: column; height: 100%; }
            .map-area { position: relative; flex: 1; min-height: 0; overflow: hidden; }
            .bubble-map, .bubble-map > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
            .bubble-map > svg { display: block; background: #1a1a1a; }

            .bubble { cursor: pointer; }
            .bubble > circle { stroke: #ffffff; stroke-opacity: 0.12; vector-effect: non-scaling-stroke; }
            /* The bubble whose details are open, outlined without a status color */
            circle.selection { fill: none; stroke: #ffffff; stroke-opacity: 0.6; stroke-width: 2; vector-effect: non-scaling-stroke; pointer-events: none; }
            .label { fill: #e5e5e5; stroke: #1a1a1a; stroke-width: 0.25em; stroke-linejoin: round; paint-order: stroke; font-weight: 500; pointer-events: none; }
            /* The map sets --zoom when a zoom ends, so an open group's name never shrinks below 11px on screen */
            .label.curved { font-size: max(var(--fitted-size), calc(11px / var(--zoom, 1))); }
            .zooming .label { display: none; }

            /* Stroke and fill opacity, since opacity on each of thousands of paths composites them one by one */
            .edge { fill: none; stroke: #d4d4d4; stroke-opacity: 0.4; marker-end: url(#edge-arrow); vector-effect: non-scaling-stroke; pointer-events: none; }
            .edge.http { stroke-dasharray: 5 4; }
            /* Only the hovered bubble's HTTP edges take the pointer, for their route tooltip */
            .edge-focus .edge.http.related { pointer-events: stroke; }
            .edge-arrow { fill: #d4d4d4; fill-opacity: 0.4; }
            .edge-focus .edge { stroke-opacity: 0.08; marker-end: url(#edge-arrow-dimmed); }
            .edge-focus .edge.related { stroke-opacity: 0.95; marker-end: url(#edge-arrow-related); }
            .edges.dense .edge { marker-end: none; }
            .edge-focus .edges.dense .edge.related { marker-end: url(#edge-arrow-related); }
            #edge-arrow-dimmed .edge-arrow { fill-opacity: 0.08; }
            #edge-arrow-related .edge-arrow { fill-opacity: 0.95; }

            /* Status, the only color on the map */
            circle.mark { stroke: #ef4444; stroke-opacity: 1; vector-effect: non-scaling-stroke; }
            circle.mark.suspected { stroke-width: 1.5; }
            circle.mark.confirmed { fill: #b91c1c; stroke-width: 3; }
            .mark-stripes rect { fill: #ef4444; }
            circle.mark-ring { fill: none; stroke: #ef4444; stroke-opacity: 0.7; stroke-width: 2; vector-effect: non-scaling-stroke; pointer-events: none; }
            circle.mark-ring.confirmed { stroke-opacity: 1; stroke-width: 4; }
            .mark-badge { font-size: 11px; font-weight: 600; pointer-events: none; }
            .mark-badge rect { fill: #1a1a1a; stroke: #ef4444; stroke-width: 1.5; }
            .mark-badge text { fill: #fca5a5; }
            .mark-badge.confirmed rect { fill: #dc2626; stroke: #fca5a5; }
            .mark-badge.confirmed text { fill: #ffffff; }
            .mark.dimmed, .mark-ring.dimmed, .mark-badge.dimmed { opacity: 0.3; }

            .legend, .bug-panel, .map-hint, .status-line, .commit-panel, .commit-banner { background: rgba(26, 26, 26, 0.88); border: 1px solid #333333; border-radius: 6px; }

            .breadcrumb { position: absolute; top: 8px; left: 8px; right: 8px; pointer-events: none; }
            .breadcrumb ol { display: flex; flex-wrap: wrap; align-items: center; margin: 0; padding: 0; list-style: none; }
            .breadcrumb li + li::before { content: '/'; margin: 0 2px; color: #737373; }
            .breadcrumb button { padding: 2px 6px; border: 1px solid #333333; border-radius: 4px; background: rgba(26, 26, 26, 0.88); color: #a3a3a3; cursor: pointer; pointer-events: auto; }
            .breadcrumb button:hover { color: #f5f5f5; text-decoration: underline; }
            .breadcrumb button[aria-current] { color: #f5f5f5; font-weight: 600; }
            .map-area:has(.bug-panel, .commit-banner) .breadcrumb { right: 284px; }

            .map-side { position: absolute; top: 8px; right: 12px; bottom: 12px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; pointer-events: none; }
            .map-side > * { pointer-events: auto; }

            .bug-panel { width: 260px; max-width: calc(100vw - 48px); min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #525252 transparent; padding: 6px 0; color: #d4d4d4; font-size: 12px; }
            .bug-panel h2, .commit-panel h2, .commit-banner h2 { margin: 0; padding: 0 10px 4px; color: #a3a3a3; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
            .bug-panel ul { margin: 0; padding: 0; list-style: none; }
            .bug-panel button { display: block; width: 100%; padding: 6px 10px; border: 0; background: none; color: inherit; text-align: left; cursor: pointer; }
            .bug-panel button:hover { background: #262626; }
            .bug-panel .bug[aria-pressed='true'] { background: #2e2e2e; box-shadow: inset 2px 0 #d4d4d4; }
            .bug-title { display: block; color: #f5f5f5; font-weight: 500; overflow-wrap: anywhere; }
            .bug-meta { display: block; margin-top: 2px; color: #a3a3a3; }
            .bug-meta code { font-family: ui-monospace, monospace; }
            .bug-panel .bug-marks { padding-bottom: 4px; }
            .bug-marks button { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; column-gap: 6px; align-items: center; padding: 4px 10px 4px 18px; }
            .mark-symbol { width: 12px; height: 12px; overflow: visible; }
            .mark-name { color: #e5e5e5; overflow-wrap: anywhere; }
            .mark-state { color: #fca5a5; }
            .mark-reason { grid-column: 2 / -1; margin-top: 2px; color: #a3a3a3; }
            .bug-marks-empty { margin: 0; padding: 4px 18px 8px; color: #a3a3a3; }

            .legend { flex: none; margin: auto 0 0; padding: 6px 10px; list-style: none; color: #d4d4d4; }
            .legend li { display: flex; align-items: center; gap: 8px; line-height: 20px; }
            .legend-symbol { width: 24px; height: 12px; overflow: visible; }
            .legend-symbol .edge { stroke-opacity: 0.9; stroke-width: 1.5; marker-end: none; }

            .details-window { position: fixed; top: 48px; left: 12px; z-index: 10; display: flex; flex-direction: column; width: 360px; max-width: calc(100vw - 24px); max-height: min(70vh, calc(100vh - 24px)); background: rgba(26, 26, 26, 0.96); border: 1px solid #404040; border-radius: 6px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); color: #d4d4d4; font-size: 12px; }
            .details-window > header { display: flex; align-items: flex-start; gap: 8px; padding: 8px 6px 8px 12px; border-bottom: 1px solid #333333; cursor: move; user-select: none; touch-action: none; }
            .details-heading { flex: 1; min-width: 0; }
            .details-heading h2 { margin: 0; color: #f5f5f5; font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
            .details-heading p { margin: 2px 0 0; color: #a3a3a3; }
            .details-close { flex: none; width: 24px; height: 24px; padding: 0; border: 0; border-radius: 4px; background: none; color: #a3a3a3; font-size: 18px; line-height: 1; cursor: pointer; }
            .details-close:hover, .details-close:focus-visible { background: #2e2e2e; color: #f5f5f5; }
            .details-body { min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #525252 transparent; padding-bottom: 6px; }
            .details-body h3 { margin: 0; padding: 10px 12px 4px; color: #a3a3a3; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
            .details-body ul { margin: 0; padding: 0; list-style: none; }
            .details-body > .details-marks { padding: 8px 12px 0; }
            .details-marks li { display: grid; grid-template-columns: 12px minmax(0, 1fr); column-gap: 6px; align-items: center; padding: 2px 0; }
            .details-end { padding: 6px 12px; border-top: 1px solid #262626; }
            .end-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
            .end-title { color: #f5f5f5; font-weight: 500; overflow-wrap: anywhere; }
            .end-title.path, .connection-name, .connection-route { font-family: ui-monospace, monospace; font-size: 11px; }
            .end-lines { flex: none; color: #a3a3a3; }
            .connections { margin-top: 4px; }
            .connections h4 { margin: 0 0 1px; color: #a3a3a3; font-size: 11px; font-weight: 500; }
            .connection { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 8px; width: 100%; padding: 2px 6px; border: 0; border-radius: 3px; background: none; color: #e5e5e5; text-align: left; cursor: pointer; }
            .connection:hover { background: #262626; }
            .connection.inside { opacity: 0.45; }
            .connection-name { overflow-wrap: anywhere; }
            .connection-holder { color: #a3a3a3; }
            .connection-route { grid-column: 1 / -1; color: #a3a3a3; }

            /* Clear of the commit list on the left and the legend on the right */
            .map-hint { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); max-width: max(240px, calc(100% - 664px)); margin: 0; padding: 6px 12px; color: #d4d4d4; text-align: center; }

            .map-corner { position: absolute; left: 12px; bottom: 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; max-width: calc(100% - 24px); pointer-events: none; }
            .map-corner > * { pointer-events: auto; }
            .status-line { margin: 0; padding: 4px 8px; color: #fcd34d; }

            .commit-panel { display: flex; flex-direction: column; width: 300px; max-width: 100%; max-height: 40vh; padding: 6px 0; color: #d4d4d4; font-size: 12px; }
            .commit-panel ul { min-height: 0; margin: 0; padding: 0; list-style: none; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #525252 transparent; }
            .commit { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; column-gap: 8px; align-items: baseline; padding: 4px 10px; cursor: pointer; }
            .commit:hover { background: #262626; }
            .commit:focus-visible { outline: 1px solid #a3a3a3; outline-offset: -1px; }
            .commit[aria-selected='true'] { background: #2e2e2e; box-shadow: inset 2px 0 #d4d4d4; }
            .commit.live { display: block; color: #f5f5f5; }
            .commit code, .commit-banner code { color: #a3a3a3; font-family: ui-monospace, monospace; }
            .commit-subject { overflow: hidden; color: #e5e5e5; white-space: nowrap; text-overflow: ellipsis; }
            .commit-age { color: #a3a3a3; white-space: nowrap; }
            .commit-error { margin: 4px 10px 0; color: #fca5a5; overflow-wrap: anywhere; }

            /* A past commit frames the whole map, so it never passes for the live state */
            .map-area:has(.commit-banner)::after { content: ''; position: absolute; inset: 0; border: 2px solid #737373; pointer-events: none; }
            .commit-banner { position: absolute; top: 8px; right: 12px; width: 260px; max-width: calc(100vw - 48px); padding: 8px 0; border-color: #737373; color: #e5e5e5; font-size: 12px; }
            .commit-banner p { margin: 2px 10px 0; overflow-wrap: anywhere; }
            .commit-banner .commit-banner-meta { color: #a3a3a3; }
            .commit-banner button { margin: 8px 10px 0; padding: 3px 10px; border: 1px solid #525252; border-radius: 4px; background: #262626; color: #f5f5f5; cursor: pointer; }
            .commit-banner button:hover { background: #333333; }

            .error-banner { max-height: 30vh; overflow-y: auto; padding: 8px 16px; background: #2a1215; border-bottom: 1px solid #5c1f24; color: #fca5a5; }
            .error-banner ul { margin: 0; padding-left: 18px; }
            .error-banner li { font-family: ui-monospace, monospace; line-height: 1.5; overflow-wrap: anywhere; }
            .error-banner button { margin-top: 4px; padding: 0; border: 0; background: none; color: inherit; text-decoration: underline; cursor: pointer; }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/main.tsx"></script>
    </body>
</html>
